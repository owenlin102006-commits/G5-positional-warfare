<html lang="zh-TW">

    <style>
        :root {
            --conan-blue: #1e3a8a; /* Deep Navy */
            --conan-red: #dc2626;  /* Bowtie Red */
            --conan-gold: #f59e0b; /* Badge Gold */
            --bg-dark: #f8fafc;
        }
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #e2e8f0; 
            color: #1e293b;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .timer-font { font-family: 'Space Mono', monospace; letter-spacing: 0.05em; }
        
        /* 封鎖線風格 */
        .crime-tape {
            background: repeating-linear-gradient(
                45deg,
                #facc15,
                #facc15 20px,
                #111827 20px,
                #111827 40px
            );
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
        }

        /* 據點等級徽章 */
        .level-badge-S { background-color: #fef08a; color: #854d0e; border: 1px solid #eab308; box-shadow: 0 0 10px rgba(234,179,8,0.5); }
        .level-badge-A { background-color: #e0e7ff; color: #3730a3; border: 1px solid #6366f1; }
        .level-badge-B { background-color: #dcfce7; color: #166534; border: 1px solid #22c55e; }

        /* 小隊顏色 */
        .team-color-0 { color: #64748b; border-color: #cbd5e1; background-color: #f1f5f9; } 
        .team-color-1 { color: #b91c1c; border-color: #fca5a5; background-color: #fef2f2; }
        .team-color-2 { color: #1d4ed8; border-color: #93c5fd; background-color: #eff6ff; }
        .team-color-3 { color: #15803d; border-color: #86efac; background-color: #f0fdf4; }
        .team-color-4 { color: #b45309; border-color: #fcd34d; background-color: #fffbeb; }
        .team-color-5 { color: #6d28d9; border-color: #c4b5fd; background-color: #f5f3ff; }
        .team-color-6 { color: #be185d; border-color: #f9a8d4; background-color: #fdf2f8; }

        .card-shadow { box-shadow: 4px 4px 0px rgba(0,0,0,0.1); border: 2px solid #334155; }
        .btn-shadow { box-shadow: 2px 2px 0px rgba(0,0,0,0.2); }
        .btn-shadow:active { box-shadow: 0px 0px 0px rgba(0,0,0,0.2); transform: translate(2px, 2px); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        
        @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        @keyframes ping-slow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.6); } }
        .animate-ping-slow { animation: ping-slow 1.4s ease-in-out infinite; }
        
        /* 載入中動畫效果 */
        @keyframes spin-slow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 4s linear infinite; }
        
        @keyframes dots-jump {
            0% { content: "."; }
            33% { content: ".."; }
            66% { content: "..."; }
            100% { content: "."; }
        }
        .loading-dots::after {
            content: ".";
            animation: dots-jump 1.2s infinite steps(1);
        }

        .folder-tab {

                { id: "A2", name: "得福亭", level: "A", owner: "未佔領", income: 90, isHidden: false, isBattling: false, battleStartTime: 0, accumulatedTime: 0, lastStartTime: 0, protectedUntil: 0 },
                { id: "B1", name: "白鴿廣場", level: "B", owner: "未佔領", income: 60, isHidden: false, isBattling: false, battleStartTime: 0, accumulatedTime: 0, lastStartTime: 0, protectedUntil: 0 },
                { id: "B2", name: "森林廣場", level: "B", owner: "未佔領", income: 60, isHidden: false, isBattling: false, battleStartTime: 0, accumulatedTime: 0, lastStartTime: 0, protectedUntil: 0 }
            ]
        };

        // Firebase 監聽器
        onSnapshot(gameRef, (snap) => {
            if (!snap.exists()) { setDoc(gameRef, defaultState); return; }
            const data = snap.data();
            // 防呆機制：若抓到舊資料(不是5個據點)，強制初始化
            if (!data.pois || data.pois.length !== 5) {
                setDoc(gameRef, defaultState);
                return;
            }
            currentState = data;
            renderUI();
        });

        // --- STREAMING_CHUNK: Modal Logic ---
        function showModal(title, message, isPrompt = false, isConfirm = false, inputType = 'password') {
            triggerHaptic('medium');
            return new Promise((resolve) => {
                const modal = document.getElementById('custom-modal');
                const content = document.getElementById('custom-modal-content');
                const input = document.getElementById('modal-input');
                const cancelBtn = document.getElementById('modal-cancel');
                const okBtn = document.getElementById('modal-ok');

                document.getElementById('modal-title').innerHTML = title;
                document.getElementById('modal-message').innerHTML = message;
                
                input.type = inputType;
                input.placeholder = inputType === 'text' ? '請輸入新內容...' : '輸入解密金鑰';
                
                if (isPrompt) { 
                    input.classList.remove('hidden'); cancelBtn.classList.remove('hidden'); input.value = ''; 
                } else if (isConfirm) {
                    input.classList.add('hidden'); cancelBtn.classList.remove('hidden'); 
                } else { 
                    input.classList.add('hidden'); cancelBtn.classList.add('hidden'); 
                }
                
                modal.classList.remove('hidden');
                setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); if(isPrompt) input.focus(); }, 10);

                const closeModal = (val) => {
                    triggerHaptic('light');
                    modal.classList.add('opacity-0'); content.classList.add('scale-95');
                    setTimeout(() => { modal.classList.add('hidden'); resolve(val); }, 300);
                };

                okBtn.replaceWith(okBtn.cloneNode(true));
                cancelBtn.replaceWith(cancelBtn.cloneNode(true));
                input.replaceWith(input.cloneNode(true));
                
                const newOkBtn = document.getElementById('modal-ok');
                const newCancelBtn = document.getElementById('modal-cancel');
                const newInput = document.getElementById('modal-input');

                newOkBtn.onclick = () => closeModal(isPrompt ? newInput.value : true);
                newCancelBtn.onclick = () => closeModal(isPrompt ? null : false);
                newInput.onkeydown = (e) => { if(e.key === 'Enter') newOkBtn.click(); };
            });
        }

        // --- POI 放大詳細資訊 Modal ---
        window.openPoiDetail = (idx) => {

            if(!currentState || !currentState.pois[idx]) return;

            let teamNum = 0;

            const body = document.getElementById('poi-detail-body');
            body.innerHTML = `
                <div class="flex items-center gap-2 mb-3">
                    <span class="px-2.5 py-1 rounded text-xs font-black level-badge-${poi.level}">${poi.level} CLASS</span>

                    </div>

            `;

            const modal = document.getElementById('poi-detail-modal');

        // --- STREAMING_CHUNK: Core Rendering ---

            currentState.pois.forEach((poi, idx) => {

                if (poi.isBattling) battlingPois.push({ poi, idx });

            const renderCard = ({ poi, idx }, big = false) => {

            let cardsHTML = '';
            ['S', 'A', 'B'].forEach(level => {

                const meta = levelMeta[level];

            cardsContainer.innerHTML = cardsHTML;

            // 🥊 戰況速覽浮動列
            const ticker = document.getElementById('battle-ticker');

            if (battlingPois.length > 0) {
                ticker.classList.remove('hidden');
                tickerList.innerHTML = battlingPois.map(({ poi, idx }) => `

            } else {

                            <button onclick="window.setShield(${idx}, 5)" class="flex-1 ${poi.isBattling ? 'bg-slate-100 text-slate-300 border-slate-200 cursor-not-allowed' : 'bg-blue-50 hover:bg-blue-100 border-blue-200 text-blue-700'} border-2 py-2 rounded-lg text-xs font-bold transition btn-shadow" ${poi.isBattling ? 'disabled' : ''}><i class="fa-solid fa-shield mr-1"></i>5m 封鎖</button>
                            <button onclick="window.setShield(${idx}, 10)" class="flex-1 ${poi.isBattling ? 'bg-slate-100 text-slate-300 border-slate-200 cursor-not-allowed' : 'bg-blue-50 hover:bg-blue-100 border-blue-200 text-blue-700'} border-2 py-2 rounded-lg text-xs font-bold transition btn-shadow" ${poi.isBattling ? 'disabled' : ''}><i class="fa-solid fa-shield-halved mr-1"></i>10m 封鎖</button>
                            <button onclick="window.setShield(${idx}, 0)" class="w-10 bg-slate-100 hover:bg-slate-200 border-2 border-slate-300 text-slate-500 py-2 rounded-lg flex items-center justify-center transition btn-shadow" title="解除封鎖"><i class="fa-solid fa-unlock"></i></button>
                        </div>
                    </div>
                `}).join('');
            }

            if (!timerInterval) timerInterval = setInterval(updateDynamicData, 1000);
            updateDynamicData(); 
        }

        // --- STREAMING_CHUNK: Timers Logic ---
        function updateDynamicData() {
            if (!currentState) return;
            const now = Date.now();

            currentState.pois.forEach((poi, idx) => {
                if (poi.isHidden && !adminRole) return;

                const shieldContainer = document.getElementById(`shield-container-${idx}`);
                const isProtected = poi.protectedUntil > now;
                if (shieldContainer) {
                    if (isProtected) {
                        const diff = poi.protectedUntil - now;
                        const m = Math.floor(diff / 60000).toString().padStart(2, '0');
                        const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                        shieldContainer.className = "bg-blue-50 border-2 border-dashed border-blue-300 rounded-lg p-2.5 flex flex-col items-center justify-center cursor-default select-none";
                        shieldContainer.innerHTML = `<span class="text-blue-700 font-black text-[10px] mb-1 tracking-widest"><i class="fa-solid fa-lock"></i> 現場封鎖中</span><span class="timer-font text-blue-600 text-sm font-bold">${m}:${s}</span>`;
                    } else if (poi.isBattling) {
                        shieldContainer.className = "bg-red-50 border-2 border-dashed border-red-300 rounded-lg p-2.5 flex flex-col items-center justify-center cursor-default select-none";
                        shieldContainer.innerHTML = `<span class="text-red-600 font-black text-[10px] mb-1 tracking-widest"><i class="fa-solid fa-triangle-exclamation"></i> 衝突處理中</span><span class="text-red-400 text-xs font-bold">無法介入</span>`;
                    } else {
                        shieldContainer.className = "bg-slate-50 border-2 border-dashed border-slate-300 rounded-lg p-2.5 flex flex-col items-center justify-center cursor-default select-none";
                        shieldContainer.innerHTML = `<span class="text-slate-400 font-bold text-[10px] mb-1 tracking-widest">區域狀態</span><span class="text-green-600 text-xs font-black"><i class="fa-solid fa-check-circle mr-1"></i>可進行搜查</span>`;
                    }
                }

                let totalMs = poi.accumulatedTime || 0;
                if (!poi.isBattling && poi.owner !== '未佔領' && poi.lastStartTime > 0) {
                    totalMs += (now - poi.lastStartTime);
                }
                
                const occTimer = document.getElementById(`occ-timer-${idx}`);
                if (occTimer && !poi.isBattling) {
                    if(poi.owner !== '未佔領') {
                        const h = Math.floor(totalMs / 3600000).toString().padStart(2, '0');
                        const m = Math.floor((totalMs % 3600000) / 60000).toString().padStart(2, '0');
                        const s = Math.floor((totalMs % 60000) / 1000).toString().padStart(2, '0');
                        occTimer.innerText = `${h}:${m}:${s}`;
                        occTimer.className = "timer-font text-slate-700 text-sm md:text-base font-bold";
                    } else {
                        occTimer.innerText = `--:--:--`;
                        occTimer.className = "timer-font text-slate-300 text-sm md:text-base font-bold";
                    }
                }

                const battleTimer = document.getElementById(`battle-timer-${idx}`);
                if (battleTimer && poi.isBattling && poi.battleStartTime > 0) {
                    const diff = now - poi.battleStartTime;
                    const m = Math.floor(diff / 60000).toString().padStart(2, '0');
                    const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                    battleTimer.innerText = `${m}:${s}`;
                }
            });
        }

        // --- STREAMING_CHUNK: Game Logic (Scoring & Battles) ---
        function calculateScore(ms, income) {
            const mins = ms / 60000;
            return Math.floor(mins / 10) * income; 
        }

        window.toggleBattle = async (idx) => {
            if(!currentState) return;
            const newPois = JSON.parse(JSON.stringify(currentState.pois));
            const poi = newPois[idx];
            const now = Date.now();

            if (!poi.isBattling) {
                if (poi.protectedUntil > now) {
                    showModal('<i class="fa-solid fa-shield-halved text-blue-500"></i> 封鎖中', '此區域目前由警方封鎖保護中，無法進行攻防！');
                    return;
                }
                if (poi.owner !== '未佔領' && poi.lastStartTime > 0) {
                    poi.accumulatedTime += (now - poi.lastStartTime);
                }
                poi.lastStartTime = 0;
                poi.isBattling = true;
                poi.battleStartTime = now;
                await updateDoc(gameRef, { pois: newPois });
            } else {
                const options = ["未佔領", "第 1 小隊", "第 2 小隊", "第 3 小隊", "第 4 小隊", "第 5 小隊", "第 6 小隊"]
                    .map(opt => `<option value="${opt}" ${poi.owner === opt ? 'selected' : ''}>${opt} ${poi.owner === opt ? '(防守方)' : ''}</option>`).join('');
                
                const selectHtml = `<div class="mt-4 text-left"><label class="text-sm font-bold text-slate-600 mb-2 block"><i class="fa-solid fa-gavel text-slate-400"></i> 判定最終掌控小隊：</label><select id="winner-select-${idx}" class="w-full bg-slate-50 border-2 border-slate-300 rounded-lg px-3 py-2 text-slate-800 outline-none focus:border-[#1e3a8a] text-base cursor-pointer font-bold shadow-sm">${options}</select></div>`;
                
                const isConfirmed = await showModal('<i class="fa-solid fa-scale-balanced text-slate-700"></i> 衝突結算', `【${poi.name}】衝突已結束，請進行結算！<br>${selectHtml}`, false, true);
                
                if (isConfirmed) {
                    const newOwner = document.getElementById(`winner-select-${idx}`).value;
                    
                    if (newOwner === poi.owner) {
                        poi.isBattling = false;
                        poi.battleStartTime = 0;
                        if(poi.owner !== '未佔領') poi.lastStartTime = now;
                        await updateDoc(gameRef, { pois: newPois });
                        showModal('<i class="fa-solid fa-shield-check text-green-500"></i> 防守成功', `【${poi.name}】由原小隊守住，搜查時間繼續累積！`);
                    } else {
                        let newTeams = JSON.parse(JSON.stringify(currentState.teams));
                        if (poi.owner !== '未佔領') {
                            const earned = calculateScore(poi.accumulatedTime, poi.income);
                            if(earned > 0) {
                                const tIdx = newTeams.findIndex(t => t.name === poi.owner);
                                if(tIdx > -1) newTeams[tIdx].wealth += earned;
                            }
                        }
                        
                        poi.owner = newOwner;
                        poi.accumulatedTime = 0;
                        poi.lastStartTime = newOwner === '未佔領' ? 0 : now;
                        poi.isBattling = false;
                        poi.battleStartTime = 0;
                        poi.protectedUntil = 0; 
                        
                        await updateDoc(gameRef, { pois: newPois, teams: newTeams });
                        showModal('<i class="fa-solid fa-check-circle text-green-500"></i> 權限轉移完成', `該區域已移交給【${newOwner}】，前任小隊資金已結算入帳！`);
                    }
                }
            }
        };

        window.confirmManualChange = async (idx) => {
            if(!currentState) return;
            const selectElem = document.getElementById(`admin-select-${idx}`);
            const newOwner = selectElem.value;
            const poi = currentState.pois[idx];
            const now = Date.now();

            if (newOwner === poi.owner) return;

            const isConfirmed = await showModal('<i class="fa-solid fa-bolt text-yellow-500"></i> 強制變更與結算', `確定要將區域控制權強制轉移給【${newOwner}】並結算原小隊嗎？`, false, true);
            if (isConfirmed) {
                const newPois = JSON.parse(JSON.stringify(currentState.pois));
                let newTeams = JSON.parse(JSON.stringify(currentState.teams));
                const activePoi = newPois[idx];

                if (activePoi.owner !== '未佔領' && activePoi.lastStartTime > 0) {
                    activePoi.accumulatedTime += (now - activePoi.lastStartTime);
                    const earned = calculateScore(activePoi.accumulatedTime, activePoi.income);
                    if(earned > 0) {
                        const tIdx = newTeams.findIndex(t => t.name === activePoi.owner);
                        if(tIdx > -1) newTeams[tIdx].wealth += earned;
                    }
                }

                activePoi.owner = newOwner;
                activePoi.accumulatedTime = 0;
                activePoi.lastStartTime = newOwner === '未佔領' ? 0 : now;
                activePoi.protectedUntil = 0;

                await updateDoc(gameRef, { pois: newPois, teams: newTeams });
                showModal('<i class="fa-solid fa-check text-green-500"></i> 變更成功', `手動結算與移交完畢！`);
            } else {
                selectElem.value = poi.owner; 
            }
        };

        // --- STREAMING_CHUNK: Admin Tools ---
        window.renamePoi = async (idx) => {
            if(!currentState) return;
            const poi = currentState.pois[idx];
            const newName = await showModal(
                '<i class="fa-solid fa-pen text-blue-500"></i> 變更據點名稱', 
                `請為【${poi.name}】輸入新的據點名稱：`, 
                true, 
                false, 
                'text'
            );
            if (newName && newName.trim() !== '' && newName.trim() !== poi.name) {
                const newPois = JSON.parse(JSON.stringify(currentState.pois));
                newPois[idx].name = newName.trim();
                await updateDoc(gameRef, { pois: newPois });
            }
        };

        window.toggleHide = async (idx) => {
            if(!currentState) return;
            const newPois = [...currentState.pois];
            newPois[idx].isHidden = !newPois[idx].isHidden;
            await updateDoc(gameRef, { pois: newPois });
        };

        window.setShield = async (idx, mins) => {
            if(!currentState) return;
            const newPois = [...currentState.pois];
            if (newPois[idx].isBattling && mins > 0) {
                showModal('<i class="fa-solid fa-ban text-red-500"></i> 拒絕執行', '衝突處理中，無法拉起封鎖線！');
                return;
            }
            newPois[idx].protectedUntil = mins > 0 ? Date.now() + (mins * 60000) : 0;
            await updateDoc(gameRef, { pois: newPois });
        };

        window.resetGame = async () => {
            if (adminRole !== 'super') return;
            const pwd = await showModal('<i class="fa-solid fa-triangle-exclamation text-red-600"></i> 重置警告', '確定要銷毀所有卷宗並歸零狀態嗎？此動作無法復原！<br>請輸入最高權限密碼：', true);
            if(pwd === '1150920') { 
                await setDoc(gameRef, defaultState);
                showModal('<i class="fa-solid fa-check text-green-500"></i> 系統已重置', '全案已清空，恢復為初始狀態。');
            } else if (pwd !== null) {
                showModal('<i class="fa-solid fa-xmark text-red-500"></i> 密碼錯誤', '權限驗證失敗，拒絕執行。');
            }
        };

        window.pushAlert = async () => {
            if (adminRole !== 'super') return;
            const input = document.getElementById('admin-alert-input');
            if(input.value.trim()) await updateDoc(gameRef, { alertMsg: input.value.trim() });
            input.value = '';
        };
        window.clearAlert = async () => { 
            if (adminRole !== 'super') return;
            await updateDoc(gameRef, { alertMsg: "" }); 
        };

        // --- STREAMING_CHUNK: Auth & UI Interactions ---
        window.setMobileTab = (tab) => {
            triggerHaptic('light');
            const adminSec = document.getElementById('admin-section');
            const statusSec = document.getElementById('status-section');
            const tabStatusBtn = document.getElementById('tab-status-btn');
            const tabAdminBtn = document.getElementById('tab-admin-btn');
            
            const activeCls = ['bg-[#1e3a8a]', 'text-white', 'border-[#1e3a8a]'];
            const inactiveCls = ['bg-white', 'text-slate-600', 'border-slate-300'];

            if (tab === 'admin') {
                statusSec.classList.add('max-xl:hidden');
                adminSec.classList.remove('max-xl:hidden');
                tabAdminBtn.classList.remove(...inactiveCls); tabAdminBtn.classList.add(...activeCls);
                tabStatusBtn.classList.remove(...activeCls); tabStatusBtn.classList.add(...inactiveCls);
            } else {
                adminSec.classList.add('max-xl:hidden');
                statusSec.classList.remove('max-xl:hidden');
                tabStatusBtn.classList.remove(...inactiveCls); tabStatusBtn.classList.add(...activeCls);
                tabAdminBtn.classList.remove(...activeCls); tabAdminBtn.classList.add(...inactiveCls);
            }
        };

        document.getElementById('admin-login-btn').onclick = async () => {
            triggerHaptic('medium');
            const pwd = await showModal('<i class="fa-solid fa-id-card-clip text-slate-700"></i> 搜查官身分驗證', '請出示您的專屬授權碼以存取警視廳終端：', true);
            
            if (rolePasswords[pwd]) {
                adminRole = rolePasswords[pwd];
                document.getElementById('admin-section').classList.remove('hidden');
                document.getElementById('status-section').classList.replace('xl:col-span-12', 'xl:col-span-7'); 
                document.getElementById('admin-login-btn').classList.add('hidden');
                document.getElementById('admin-logout-btn').classList.remove('hidden');
                document.getElementById('admin-logout-btn').classList.add('flex');
                document.getElementById('mobile-tab-bar').classList.remove('hidden');
                window.setMobileTab('status');
                
                let roleName = adminRole === 'super' ? '警視總監' : `現場搜查官 (${currentState.pois.find(p=>p.id === adminRole).name})`;
                showModal('<i class="fa-solid fa-check-circle text-green-500"></i> 驗證通過', `歡迎登入，${roleName}。`);
                
                if (currentState) renderUI();
            } else if (pwd !== null) {
                showModal('<i class="fa-solid fa-circle-xmark text-red-500"></i> 存取被拒', '查無此授權碼。');
            }
        };

        document.getElementById('admin-logout-btn').onclick = () => {
            triggerHaptic('light');
            adminRole = null;
            document.getElementById('admin-section').classList.add('hidden');
            document.getElementById('admin-section').classList.remove('max-xl:hidden');
            document.getElementById('status-section').classList.remove('max-xl:hidden');
            document.getElementById('status-section').classList.replace('xl:col-span-7', 'xl:col-span-12');
            document.getElementById('admin-login-btn').classList.remove('hidden');
            document.getElementById('admin-logout-btn').classList.add('hidden');
            document.getElementById('admin-logout-btn').classList.remove('flex');
            document.getElementById('mobile-tab-bar').classList.add('hidden');
            if (currentState) renderUI();
        };

        document.getElementById('map-upload').addEventListener('change', async function(e) {
            if (adminRole !== 'super') return;
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('map-file-name').innerText = file.name;
            const reader = new FileReader();
            reader.onload = async (event) => await updateDoc(gameRef, { mapUrl: event.target.result });
            reader.readAsDataURL(file);
        });

        // 鎖定重置按鈕長按邏輯
        (() => {
            const btn = document.getElementById('reset-game-btn');
            const progress = document.getElementById('reset-progress');
            let holdTimer = null;

            const startHold = (e) => {
                if(e.button !== undefined && e.button !== 0) return; // Only left click
                progress.style.transition = 'width 2s linear';
                progress.style.width = '100%';
                holdTimer = setTimeout(() => { window.resetGame(); cancelHold(); }, 2000);
            };
            const cancelHold = () => {
                clearTimeout(holdTimer);
                progress.style.transition = 'width 0.15s ease-out';
                progress.style.width = '0%';
            };

            btn.addEventListener('mousedown', startHold);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); startHold(e); }, { passive: false });
            ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(evt => btn.addEventListener(evt, cancelHold));
        })();

    </script>
</body>
</html>
